spring:
  application:
    name: txdemo

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_URL}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true

  batch:
    jdbc:
      initialize-schema: always   # ✅ CORRECT PLACE
    job:
      enabled: false              # runtime trigger via API

server:
  port: 8585
